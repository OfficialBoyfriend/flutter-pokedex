  shared_preferences: ^2.5.4
  flutter_slidable: ^4.0.3
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.12.2
  flutter_gen_runner:
