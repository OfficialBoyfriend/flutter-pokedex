name: pokedex
description: "A new Flutter project."
version: 1.0.0+1
publish_to: 'none' 

environment:
  sdk: '>=3.11.0 <4.0.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^8.0.2
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3+1
  flutter_svg: ^2.2.4
  logger: any
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  collection: ^1.19.1
  gap: 3.0.1
  shimmer: 3.0.0
